services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clauselens
      POSTGRES_PASSWORD: clauselens
      POSTGRES_DB: clauselens
    ports:
      - "5434:5432"
    volumes:
      - clauselens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauselens -d clauselens"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://clauselens:clauselens@db:5432/clauselens
      UPLOAD_DIR: /app/uploads
      # In-container localhost is not the Windows host. Override this only when needed.
      OLLAMA_BASE_URL: "${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}"
    ports:
      - "8001:8000"
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  clauselens_postgres_data:
