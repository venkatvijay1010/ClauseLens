name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: DATABASE_URL=sqlite:///./migration-ci.db alembic upgrade head
      - run: ruff check .
      - run: pytest
      - run: python scripts/run_evaluation.py
